[alembic]
# Alembic for Phase 2 — adds columns to Phase 1's SQLite database
# The DATABASE_URL must match Phase 1's database exactly
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Overridden by env.py which reads DATABASE_URL from .env
sqlalchemy.url = sqlite:///./memory.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
